name: guide_point
description: GuidePoint — QR-based indoor navigation with voice guidance.
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core Functionality & UI
  collection: ^1.18.0
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  mobile_scanner: ^3.5.5
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3

  # Voice, Speech, and Hardware Keys
  flutter_tts: ^3.8.3
  speech_to_text: ^7.0.0

  # AnchorStep: position from steps
  pedometer: ^4.0.1

  # Scene CNN (AnchorStep waypoint confirmation)
  tflite_flutter: ^0.12.0
  image: ^4.1.3
  camera: ^0.10.5+9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

# Configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Icons/app_icon.png"
  min_sdk_android: 23

# Flutter Assets
flutter:
  uses-material-design: true
  assets:
    - assets/Icons/app_icon.png
    - assets/models/
    - assets/maps/